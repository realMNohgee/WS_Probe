name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Compile check
        run: python3 -m py_compile WS_Probe.py
      - name: Smoke test (--help)
        run: python3 WS_Probe.py --help
